<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090B" />
    <meta name="description" content="Lumina AI" />
    <title>LifeOS</title>
    <style>
      html, body {
        background-color: #09090B !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::before {
        content: 'LifeOS...';
        color: #4DA3FF;
        font-family: sans-serif;
        font-size: 14px;
        opacity: 0.5;
      }
    </style>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<div style="background:#09090B; color:white; padding:20px; position:fixed; inset:0; z-index:9999; overflow:auto; font-family:sans-serif;">' +
          '<h1 style="color:#EF4444">Ошибка запуска</h1><p>' + msg + '</p>' +
          '<pre style="font-size:10px; opacity:0.5">' + (error && error.stack ? error.stack : '') + '</pre></div>';
        return false;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
